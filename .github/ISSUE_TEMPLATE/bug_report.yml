name: Signaler un bug
description: Décrire un problème rencontré dans ORBIT OS.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler le problème. Ne joins pas de clé API, mot de passe, contenu du presse-papiers ou autre donnée privée.
  - type: input
    id: version
    attributes:
      label: Version d’ORBIT OS
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Version de Windows
      options:
        - Windows 11
        - Windows 10
        - Autre
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module concerné
      placeholder: "Echo, Pulsar, Stream Deck…"
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      description: Liste les étapes les plus courtes qui déclenchent le problème.
      placeholder: "1. Ouvrir…\n2. Cliquer…\n3. Observer…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Informations complémentaires
      description: Ajoute les détails utiles. Retire les données personnelles et sensibles des captures ou journaux.
