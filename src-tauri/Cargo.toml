[package]
name = "orbit-os"
version = "1.0.1"
description = "ORBIT OS — Project Nebula"
authors = ["ORBIT OS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orbit_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "=2.3.1"
arboard = "3"
base64 = "0.22"
png = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zeroize = "1"
