[package]
name = "orbit-credential-helper"
version = "1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "orbit-credential-helper"
path = "src/main.rs"

[dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-registry = "0.6.1"
